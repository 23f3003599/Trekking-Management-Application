<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Update Trek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold">
            🏔 Trekking Management
        </a>

        <div>

            <a href="/assigned_treks" class="btn btn-outline-light btn-sm">
                Assigned Treks
            </a>

            <a href="/staff" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

            <a href="/logout" class="btn btn-danger btn-sm">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="text-center">

                        Update Trek

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Trek Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ trek.name }}"
                                readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Available Slots

                            </label>

                            <input
                                type="number"
                                name="slots"
                                class="form-control"
                                value="{{ trek.slots }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Trek Status

                            </label>

                            <select
                                name="status"
                                class="form-select">

                                <option value="Open"
                                {% if trek.status=="Open" %}
                                selected
                                {% endif %}>
                                Open
                                </option>

                                <option value="Closed"
                                {% if trek.status=="Closed" %}
                                selected
                                {% endif %}>
                                Closed
                                </option>

                                <option value="Completed"
                                {% if trek.status=="Completed" %}
                                selected
                                {% endif %}>
                                Completed
                                </option>

                            </select>

                        </div>

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-warning">

                                Update Trek

                            </button>

                            <a
                                href="/assigned_treks"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
