<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Trek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold">
            🏔 Trekking Management
        </a>

        <div>

            <a href="/admin" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

            <a href="/view_treks" class="btn btn-outline-light btn-sm">
                View Treks
            </a>

            <a href="/logout" class="btn btn-danger btn-sm">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="text-center">

                        Add New Trek

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Trek Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter Trek Name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                placeholder="Enter Location"
                                required>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Difficulty
                                </label>

                                <select
                                    name="difficulty"
                                    class="form-select">

                                    <option>Easy</option>
                                    <option>Moderate</option>
                                    <option>Hard</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Duration (Days)
                                </label>

                                <input
                                    type="number"
                                    name="duration"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Available Slots
                                </label>

                                <input
                                    type="number"
                                    name="slots"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Assign Staff
                                </label>

                                <select
                                    name="staff_id"
                                    class="form-select">

                                    {% for staff in staff_members %}

                                    <option value="{{ staff.id }}">
                                        {{ staff.name }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Start Date
                                </label>

                                <input
                                    type="date"
                                    name="start_date"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    End Date
                                </label>

                                <input
                                    type="date"
                                    name="end_date"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="text-center mt-4">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Add Trek

                            </button>

                            <a
                                href="/view_treks"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
