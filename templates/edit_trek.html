<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Trek</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold">

🏔 Trekking Management

</a>

<div>

<a href="/admin" class="btn btn-outline-light btn-sm">

Dashboard

</a>

<a href="/view_treks" class="btn btn-outline-light btn-sm">

View Treks

</a>

<a href="/logout" class="btn btn-danger btn-sm">

Logout

</a>

</div>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning text-center">

<h2>Edit Trek</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Trek Name

</label>

<input
type="text"
name="name"
class="form-control"
value="{{ trek.name }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Location

</label>

<input
type="text"
name="location"
class="form-control"
value="{{ trek.location }}"
required>

</div>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Difficulty

</label>

<select
name="difficulty"
class="form-select">

<option value="Easy"
{% if trek.difficulty=="Easy" %}selected{% endif %}>

Easy

</option>

<option value="Moderate"
{% if trek.difficulty=="Moderate" %}selected{% endif %}>

Moderate

</option>

<option value="Hard"
{% if trek.difficulty=="Hard" %}selected{% endif %}>

Hard

</option>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

Duration (Days)

</label>

<input
type="number"
name="duration"
class="form-control"
value="{{ trek.duration }}"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Available Slots

</label>

<input
type="number"
name="slots"
class="form-control"
value="{{ trek.slots }}"
required>

</div>

<div class="col-md-6">

<label class="form-label">

Assign Staff

</label>

<select
name="staff_id"
class="form-select">

{% for staff in staff_members %}

<option
value="{{ staff.id }}"
{% if trek.staff_id==staff.id %}selected{% endif %}>

{{ staff.name }}

</option>

{% endfor %}

</select>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Start Date

</label>

<input
type="date"
name="start_date"
class="form-control"
value="{{ trek.start_date }}"
required>

</div>

<div class="col-md-6">

<label class="form-label">

End Date

</label>

<input
type="date"
name="end_date"
class="form-control"
value="{{ trek.end_date }}"
required>

</div>

</div>

<br>

<!-- NEW STATUS DROPDOWN -->

<div class="mb-3">

<label class="form-label">

Status

</label>

<select
name="status"
class="form-select">

<option value="Open"
{% if trek.status=="Open" %}selected{% endif %}>

Open

</option>

<option value="Closed"
{% if trek.status=="Closed" %}selected{% endif %}>

Closed

</option>

<option value="Completed"
{% if trek.status=="Completed" %}selected{% endif %}>

Completed

</option>

</select>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-warning btn-lg">

Update Trek

</button>

<a
href="/view_treks"
class="btn btn-secondary btn-lg">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
