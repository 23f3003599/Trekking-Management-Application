<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold">

🏔 Trekking Management

</a>

<div>

<a href="/user" class="btn btn-outline-light btn-sm">

Dashboard

</a>

<a href="/logout" class="btn btn-danger btn-sm">

Logout

</a>

</div>

</div>

</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3 class="text-center">

My Profile

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Name

</label>

<input
type="text"
name="name"
class="form-control"
value="{{ user.name }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control"
value="{{ user.email }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

New Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Leave blank to keep old password">

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-success">

Update Profile

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
